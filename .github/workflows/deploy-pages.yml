name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mkdocs-material
      - name: 组装站点内容到 docs/
        run: |
          mkdir -p docs
          cp PLAN.md docs/PLAN.md
          cp index.md docs/index.md
          cp README.md docs/README.md
          cp -r notes docs/notes
          cp -r papers docs/papers
          cp -r reviews docs/reviews
      - run: mkdocs gh-deploy --force
